<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification System</title>
  <style>
    /* (Same styles as before – compact for brevity) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
      padding: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2.5rem;
      padding: 3rem 2.8rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header .icon { font-size: 2.8rem; margin-bottom: 0.4rem; display: block; }
    .header h1 {
      color: #f0f4ff;
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0f4ff, #a0c4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: rgba(255,255,255,0.5); font-size: 0.95rem; margin-top: 0.3rem; font-weight: 300; }
    .step-indicator { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      transition: background 0.4s ease, transform 0.3s ease;
    }
    .step-dot.active { background: #4f8cff; transform: scale(1.3); box-shadow: 0 0 16px rgba(79,140,255,0.4); }
    .step-dot.done { background: #34c759; }
    .form-group { margin-bottom: 1.6rem; }
    .form-group label { display: block; color: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.3px; margin-bottom: 0.4rem; }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border-radius: 1.2rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-wrapper:focus-within { border-color: #4f8cff; box-shadow: 0 0 0 4px rgba(79,140,255,0.15); }
    .input-wrapper .input-icon { padding: 0 0 0 1.2rem; color: rgba(255,255,255,0.3); font-size: 1.1rem; }
    .input-wrapper input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f4ff;
      font-size: 1rem;
      font-weight: 400;
    }
    .input-wrapper input::placeholder { color: rgba(255,255,255,0.2); font-weight: 300; }
    .otp-input-wrapper input { text-align: center; font-size: 1.6rem; letter-spacing: 1rem; font-weight: 600; }
    .btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.2px;
    }
    .btn-primary { background: linear-gradient(135deg, #4f8cff, #6c5ce7); color: #fff; box-shadow: 0 6px 24px rgba(79,140,255,0.25); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(79,140,255,0.35); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-success { background: linear-gradient(135deg, #34c759, #28a745); color: #fff; box-shadow: 0 6px 24px rgba(52,199,89,0.25); }
    .btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(52,199,89,0.35); }
    .btn-success:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-outline { background: transparent; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.12); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-group { display: flex; gap: 0.8rem; }
    .btn-group .btn { flex: 1; }
    .otp-display {
      background: rgba(255,255,255,0.04);
      border-radius: 1.2rem;
      padding: 1.2rem;
      text-align: center;
      margin: 1.2rem 0;
      border: 1px dashed rgba(79,140,255,0.2);
    }
    .otp-display .otp-code {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.8rem;
      background: linear-gradient(135deg, #4f8cff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Courier New', monospace;
    }
    .otp-display .otp-label { color: rgba(255,255,255,0.3); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .message {
      padding: 0.8rem 1.2rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 1.2rem;
      display: none;
      animation: fadeSlide 0.4s ease;
    }
    .message.show { display: block; }
    .message.success { background: rgba(52,199,89,0.12); border: 1px solid rgba(52,199,89,0.2); color: #6fdf8a; }
    .message.error { background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.2); color: #ff6b5e; }
    .message.info { background: rgba(79,140,255,0.10); border: 1px solid rgba(79,140,255,0.15); color: #8ab4ff; }
    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
    .timer { text-align: center; color: rgba(255,255,255,0.25); font-size: 0.8rem; margin-top: 0.8rem; font-weight: 300; }
    .timer span { color: #4f8cff; font-weight: 600; }
    @media (max-width: 480px) { .card { padding: 2rem 1.5rem; border-radius: 1.8rem; } .header h1 { font-size: 1.5rem; } .otp-display .otp-code { font-size: 2rem; letter-spacing: 0.5rem; } .btn-group { flex-direction: column; } }
    .hidden { display: none !important; }
    .mt-1 { margin-top: 0.8rem; }
    .mb-1 { margin-bottom: 0.8rem; }
    .text-center { text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="header">
      <span class="icon">📧</span>
      <h1>OTP Verify</h1>
      <p>Secure email verification with one‑time code</p>
    </div>
    <div class="step-indicator">
      <span class="step-dot active" id="dot1"></span>
      <span class="step-dot" id="dot2"></span>
      <span class="step-dot" id="dot3"></span>
    </div>

    <!-- STEP 1 -->
    <div id="step-email">
      <div class="form-group">
        <label for="emailInput">📬 Gmail Address</label>
        <div class="input-wrapper">
          <span class="input-icon">@</span>
          <input type="email" id="emailInput" placeholder="you@gmail.com" autocomplete="email" />
        </div>
      </div>
      <button class="btn btn-primary" id="sendOtpBtn">✉️ Send OTP</button>
    </div>

    <!-- STEP 2 -->
    <div id="step-otp" class="hidden">
      <div class="form-group">
        <label for="otpInput">🔐 Enter 6‑Digit Code</label>
        <div class="input-wrapper otp-input-wrapper">
          <input type="text" id="otpInput" maxlength="6" placeholder="••••••" inputmode="numeric" autocomplete="one-time-code" />
        </div>
      </div>
      <div class="otp-display" id="otpDisplay">
        <div class="otp-label">📨 OTP sent to your email</div>
        <div class="otp-code" id="otpCode">------</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-success" id="verifyOtpBtn">✅ Verify</button>
        <button class="btn btn-outline" id="resendOtpBtn">⟳ Resend</button>
      </div>
      <div class="timer" id="timerDisplay">⏳ Resend available in <span id="timerCount">60</span>s</div>
    </div>

    <!-- STEP 3 -->
    <div id="step-verified" class="hidden">
      <div class="otp-display" style="border-color: rgba(52,199,89,0.3);">
        <div style="font-size:3rem; margin-bottom:0.2rem;">🎉</div>
        <div style="color:#6fdf8a; font-weight:600; font-size:1.2rem;">Verified Successfully!</div>
        <div style="color:rgba(255,255,255,0.3); font-size:0.85rem; margin-top:0.2rem;">
          <span id="verifiedEmail">—</span> is confirmed
        </div>
      </div>
      <button class="btn btn-outline" id="resetBtn">🔄 Start Over</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    // ----- DOM refs -----
    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const stepVerified = document.getElementById('step-verified');
    const dot1 = document.getElementById('dot1');
    const dot2 = document.getElementById('dot2');
    const dot3 = document.getElementById('dot3');
    const emailInput = document.getElementById('emailInput');
    const otpInput = document.getElementById('otpInput');
    const otpCodeDisplay = document.getElementById('otpCode');
    const verifiedEmailSpan = document.getElementById('verifiedEmail');
    const sendBtn = document.getElementById('sendOtpBtn');
    const verifyBtn = document.getElementById('verifyOtpBtn');
    const resendBtn = document.getElementById('resendOtpBtn');
    const resetBtn = document.getElementById('resetBtn');
    const messageEl = document.getElementById('message');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerCount = document.getElementById('timerCount');

    let currentEmail = '';
    let timerInterval = null;
    let remainingSeconds = 60;
    let isVerified = false;

    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }
    function hideMessage() { messageEl.className = 'message'; }

    function setStep(step) {
      stepEmail.classList.toggle('hidden', step !== 1);
      stepOtp.classList.toggle('hidden', step !== 2);
      stepVerified.classList.toggle('hidden', step !== 3);
      dot1.className = 'step-dot' + (step >= 1 ? ' active' : '') + (step > 1 ? ' done' : '');
      dot2.className = 'step-dot' + (step >= 2 ? ' active' : '') + (step > 2 ? ' done' : '');
      dot3.className = 'step-dot' + (step >= 3 ? ' active' : '') + (step > 3 ? ' done' : '');
    }

    function startTimer(seconds = 60) {
      clearInterval(timerInterval);
      remainingSeconds = seconds;
      timerDisplay.classList.remove('hidden');
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerDisplay.classList.add('hidden');
          resendBtn.disabled = false;
        }
      }, 1000);
    }
    function updateTimerDisplay() { timerCount.textContent = Math.max(0, remainingSeconds); }
    function resetTimer() { clearInterval(timerInterval); timerDisplay.classList.add('hidden'); resendBtn.disabled = false; }
    function hideOtpDisplay() { otpCodeDisplay.textContent = '------'; }

    // ----- API calls with robust error handling -----
    const apiBaseUrl = window.location.port === '3001' ? '' : 'http://localhost:3001';

    async function sendOtp(email) {
      try {
        const res = await fetch(`${apiBaseUrl}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          throw new Error('The OTP server returned HTML instead of JSON. Start server.js and use http://localhost:3001.');
        }
        const data = await res.json();
        return data;
      } catch (err) {
        return { success: false, error: err.message || 'Network error' };
      }
    }

    async function verifyOtp(email, otp) {
      try {
        const res = await fetch(`${apiBaseUrl}/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          throw new Error('The OTP server returned HTML instead of JSON. Start server.js and use http://localhost:3001.');
        }
        const data = await res.json();
        return data;
      } catch (err) {
        return { success: false, error: err.message || 'Network error' };
      }
    }

    // ----- Event handlers -----
    sendBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) { showMessage('Please enter your Gmail address.', 'error'); return; }
      if (!email.endsWith('@gmail.com')) { showMessage('Please enter a valid @gmail.com address.', 'error'); return; }

      hideMessage();
      sendBtn.disabled = true;
      sendBtn.textContent = '⏳ Sending...';

      const result = await sendOtp(email);

      sendBtn.disabled = false;
      sendBtn.textContent = '✉️ Send OTP';

      if (result.success) {
        currentEmail = email;
        hideOtpDisplay();
        setStep(2);
        otpInput.value = '';
        otpInput.focus();
        showMessage(`✅ OTP sent to ${email}. Check your inbox.`, 'success');
        resendBtn.disabled = true;
        startTimer(60);
      } else {
        showMessage(result.error || 'Failed to send OTP. Try again.', 'error');
      }
    });

    verifyBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      if (!otp) { showMessage('Please enter the 6‑digit OTP.', 'error'); return; }
      if (otp.length !== 6 || !/^\d{6}$/.test(otp)) { showMessage('OTP must be exactly 6 digits.', 'error'); return; }

      hideMessage();
      verifyBtn.disabled = true;
      verifyBtn.textContent = '⏳ Verifying...';

      const result = await verifyOtp(currentEmail, otp);

      verifyBtn.disabled = false;
      verifyBtn.textContent = '✅ Verify';

      if (result.success) {
        isVerified = true;
        verifiedEmailSpan.textContent = currentEmail;
        setStep(3);
        showMessage('🎉 Email verified successfully!', 'success');
        resetTimer();
      } else {
        showMessage(result.error || 'Invalid OTP. Please try again.', 'error');
        otpInput.value = '';
        otpInput.focus();
      }
    });

    resendBtn.addEventListener('click', async () => {
      if (!currentEmail) return;
      hideMessage();
      resendBtn.disabled = true;
      resendBtn.textContent = '⏳ Sending...';

      const result = await sendOtp(currentEmail);

      resendBtn.disabled = false;
      resendBtn.textContent = '⟳ Resend';

      if (result.success) {
        hideOtpDisplay();
        showMessage(`✅ New OTP sent to ${currentEmail}. Check your inbox.`, 'success');
        resendBtn.disabled = true;
        startTimer(60);
        otpInput.value = '';
        otpInput.focus();
      } else {
        showMessage(result.error || 'Failed to resend OTP.', 'error');
        resendBtn.disabled = false;
      }
    });

    resetBtn.addEventListener('click', () => {
      isVerified = false;
      currentEmail = '';
      hideOtpDisplay();
      emailInput.value = '';
      otpInput.value = '';
      setStep(1);
      hideMessage();
      resetTimer();
      sendBtn.disabled = false;
      sendBtn.textContent = '✉️ Send OTP';
      verifyBtn.disabled = false;
      verifyBtn.textContent = '✅ Verify';
      resendBtn.disabled = false;
      resendBtn.textContent = '⟳ Resend';
      emailInput.focus();
    });

    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    otpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyBtn.click(); });
    otpInput.addEventListener('input', () => {
      const val = otpInput.value.replace(/\D/g, '');
      if (val.length > 6) otpInput.value = val.slice(0, 6);
    });

    // Init
    setStep(1);
    emailInput.focus();
    hideMessage();
    resetTimer();
  </script>
</body>
</html>
